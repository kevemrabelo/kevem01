<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Agendamentos</title>
<style>
  :root {
    --bg: #f3f5f7; --card: #ffffff; --text: #16202a; --muted: #6b7785; --line: #e3e8ee;
    --brand: #0f766e; --brand-2: #14b8a6; --brand-soft: #e6f6f4;
    --warn: #b45309; --warn-soft: #fff4e5; --danger: #c0392b; --danger-soft: #fdecea;
    --free: #15803d; --free-soft: #ecfdf3; --free-line: #86efac;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1317; --card: #172026; --text: #e8eef2; --muted: #93a1ad; --line: #26323a;
      --brand: #2dd4bf; --brand-2: #14b8a6; --brand-soft: #123a36;
      --warn: #f59e0b; --warn-soft: #3a2a12; --danger: #f87171; --danger-soft: #3b1a1a;
      --free: #4ade80; --free-soft: #12301f; --free-line: #2f6b45;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }

  header.top { position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 10px; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .top h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .icon-btn { background: rgba(255,255,255,.15); border: 0; color: #fff; width: 40px; height: 40px;
    border-radius: 12px; display: grid; place-items: center; cursor: pointer; }
  .icon-btn svg { width: 22px; height: 22px; }
  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .week-nav span { font-weight: 600; font-size: 15px; }
  .days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
  .day { background: rgba(255,255,255,.12); border: 0; border-radius: 12px; padding: 6px 0; color: #fff;
    display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 0; }
  .day small { font-size: 11px; opacity: .85; text-transform: uppercase; letter-spacing: .03em; }
  .day b { font-size: 18px; }
  .day i { font-style: normal; font-size: 11px; min-height: 15px; opacity: .9; }
  .day.sel { background: #fff; color: #0f766e; }
  .day.today:not(.sel) { outline: 2px solid rgba(255,255,255,.7); }

  main { padding: 14px 16px 120px; max-width: 640px; margin: 0 auto; }
  .day-title { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 0 10px; }
  .day-title h2 { margin: 0; font-size: 17px; }
  .day-title h2::first-letter { text-transform: uppercase; }
  .day-title span { color: var(--muted); font-size: 14px; }

  .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px;
    display: flex; gap: 12px; align-items: center; margin-bottom: 8px; cursor: pointer; border: 1px solid var(--line); }
  .time { min-width: 58px; text-align: center; font-weight: 700; font-size: 17px; color: var(--brand);
    background: var(--brand-soft); border-radius: 10px; padding: 8px 4px; }
  .info { flex: 1; min-width: 0; }
  .info .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .meta { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
    background: var(--warn-soft); color: var(--warn); margin-left: 6px; vertical-align: 2px; }
  .card.free { background: transparent; border: 1.5px dashed var(--free-line); box-shadow: none; }
  .card.free .time { background: var(--free-soft); color: var(--free); }
  .card.free .name { color: var(--free); }
  .card.free .plus { color: var(--free); font-weight: 700; font-size: 22px; }
  .eq { font-weight: 700; color: var(--brand); }
  .card.free .eq { color: var(--free); }
  .chip small { display: block; font-size: 10px; font-weight: 600; }
  .chip.livre { border-color: var(--free-line); color: var(--free); background: var(--free-soft); }
  .chip.ocupado { opacity: .6; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; opacity: 1; }
  .lunch { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 10px 0; }
  .lunch::before, .lunch::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

  .fab { position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 6;
    background: var(--brand); color: #fff; border: 0; border-radius: 18px; padding: 15px 20px;
    font-weight: 700; font-size: 16px; box-shadow: 0 6px 18px rgba(15,118,110,.35); display: flex; gap: 8px;
    align-items: center; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .fab { color: #062b27; } .day.sel { color: #0f766e; } }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--card);
    border-radius: 20px 20px 0 0; padding: 8px 16px calc(env(safe-area-inset-bottom) + 16px);
    max-height: 92vh; overflow-y: auto; transform: translateY(105%); transition: transform .22s ease;
    max-width: 640px; margin: 0 auto; }
  .sheet.open { transform: none; }
  .grab { width: 40px; height: 5px; background: var(--line); border-radius: 3px; margin: 4px auto 10px; }
  .sheet h3 { margin: 0 0 12px; font-size: 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
  input, select { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); font-size: 16px; }
  input:focus, select:focus { outline: 2px solid var(--brand-2); border-color: transparent; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px;
    font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
  .hint { font-size: 13px; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: var(--warn-soft);
    color: var(--warn); display: none; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; cursor: pointer; font-size: 16px; }
  .btn.primary { background: var(--brand); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #062b27; } }
  .btn.ghost { background: var(--bg); border: 1px solid var(--line); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); flex: 0 0 auto; padding: 14px 16px; }
  .btn:disabled { opacity: .6; }

  .detail-line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 12px; }
  .detail-line span { color: var(--muted); }
  .detail-line b { text-align: right; overflow-wrap: anywhere; }
  .contact { display: flex; gap: 10px; margin-top: 14px; }
  .contact a { flex: 1; text-align: center; text-decoration: none; padding: 12px; border-radius: 12px;
    font-weight: 600; background: var(--brand-soft); color: var(--brand); }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: #16202a; color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 20; font-size: 14px;
    transition: all .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast.err { background: var(--danger); }
  .loading { text-align: center; color: var(--muted); padding: 30px; }
  .spin { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--brand);
    border-radius: 50%; animation: s .7s linear infinite; vertical-align: -3px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .demo { background: var(--warn-soft); color: var(--warn); font-size: 12px; text-align: center; padding: 6px; }
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Modo demonstração — os dados não vão para a planilha.</div>
<header class="top">
  <div class="top-row">
    <h1>Agendamentos</h1>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="btnHoje" title="Hoje" aria-label="Ir para hoje">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      </button>
      <button class="icon-btn" id="btnRefresh" title="Atualizar" aria-label="Atualizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
  </div>
  <div class="week-nav">
    <button class="icon-btn" id="prevWeek" aria-label="Semana anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span id="weekLabel"></span>
    <button class="icon-btn" id="nextWeek" aria-label="Próxima semana">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
  <div class="days" id="days"></div>
</header>

<main>
  <div class="day-title"><h2 id="dayTitle"></h2><span id="dayTotal"></span></div>
  <div id="list"><div class="loading"><span class="spin"></span>Carregando…</div></div>
</main>

<button class="fab" id="fab">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
  Agendar
</button>

<div class="sheet-bg" id="sheetBg"></div>

<!-- Formulário -->
<div class="sheet" id="formSheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="formTitle">Novo agendamento</h3>
  <form id="form" autocomplete="off">
    <label for="fNome">Cliente</label>
    <input id="fNome" placeholder="Nome do cliente" required>
    <label for="fObs">Observação (opcional)</label>
    <input id="fObs" placeholder="ex.: retorno, diagnóstico, troca de tela">
    <div class="chips" id="obsChips"></div>
    <label for="fTel">Telefone / WhatsApp</label>
    <input id="fTel" type="tel" inputmode="tel" placeholder="94 9 9999-9999">
    <div class="row2">
      <div>
        <label for="fData">Data</label>
        <input id="fData" type="date" required>
      </div>
      <div>
        <label for="fHora">Horário</label>
        <input id="fHora" type="time" required step="60">
      </div>
    </div>
    <div class="chips" id="horaChips"></div>
    <div class="hint" id="hint"></div>
    <label for="fServ">Serviço</label>
    <input id="fServ" list="servicos" value="HIGIENIZAÇÃO">
    <datalist id="servicos"></datalist>
    <div class="actions">
      <button type="button" class="btn ghost" id="btnCancel">Cancelar</button>
      <button type="submit" class="btn primary" id="btnSave">Salvar na planilha</button>
    </div>
  </form>
</div>

<!-- Detalhes -->
<div class="sheet" id="detailSheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="dTitle"></h3>
  <div id="dBody"></div>
  <div class="contact" id="dContact"></div>
  <div class="actions">
    <button class="btn danger" id="btnDelete" aria-label="Cancelar agendamento">Cancelar</button>
    <button class="btn primary" id="btnEdit">Editar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  // ---------- Ponte com o Apps Script (ou modo demonstração) ----------
  var DEMO = !(window.google && google.script && google.script.run);
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (DEMO) return Demo[fn].apply(null, args);
    return new Promise(function (res, rej) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(e); });
      r[fn].apply(r, args);
    });
  }

  // ---------- Datas ----------
  var DIAS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  var DIAS_LONGOS = ['segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
  var MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  function pad(n) { return ('0' + n).slice(-2); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function monday(d) { var g = d.getDay(); return addDays(d, g === 0 ? 1 : 1 - g); } // domingo -> próxima segunda
  function br(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function minToHHMM(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function hhmmToMin(s) { var p = s.split(':'); return +p[0] * 60 + +p[1]; }
  function fmtHora(m, txt) { return m == null ? (txt || '—') : (Math.floor(m / 60) + 'h' + (m % 60 ? pad(m % 60) : '')); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function digits(s) { return String(s || '').replace(/\D/g, ''); }

  // ---------- Horários fixos (iguais aos da planilha) ----------
  var HORARIOS = ['08:30', '10:30', '14:00', '16:00'];
  // Cada horário tem uma vaga por equipe
  var EQUIPES = ['Equipe 1', 'Equipe 2'];
  // agendamentos do dia no mesmo horário (a planilha usa 8h29, 8h31... então tolera 5 min)
  function ocupados(diaIso, m) {
    return state.itens.filter(function (x) {
      return !x.livre && x.data === diaIso && x.min != null && Math.abs(x.min - m) <= 5 && (!state.editando || x.row !== state.editando.row);
    }).sort(function (a, b) { return a.row - b.row; });
  }
  // todas as linhas do horário (ocupadas e vagas livres da planilha), na ordem da planilha
  function linhasDoHorario(diaIso, m) {
    return state.itens.filter(function (x) { return x.data === diaIso && x.min != null && Math.abs(x.min - m) <= 5; })
      .sort(function (a, b) { return a.row - b.row; });
  }
  function vagasTexto(n) {
    var v = EQUIPES.length - n;
    return v <= 0 ? 'lotado' : v === 1 ? '1 vaga' : v + ' vagas';
  }

  // ---------- Estado ----------
  var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  var state = {
    semana: monday(hoje),
    dia: hoje.getDay() === 0 ? 0 : hoje.getDay() - 1,
    itens: [],
    editando: null,
    atual: null
  };
  var $ = function (id) { return document.getElementById(id); };

  // ---------- Carregar ----------
  function carregar() {
    $('list').innerHTML = '<div class="loading"><span class="spin"></span>Carregando…</div>';
    var de = iso(state.semana), ate = iso(addDays(state.semana, 5));
    return call('listarAgendamentos', de, ate).then(function (r) {
      state.itens = r || [];
      render();
    }).catch(function (e) {
      $('list').innerHTML = '<div class="empty"><b>Não consegui ler a planilha</b>' + esc(e && e.message || e) + '</div>';
    });
  }

  function render() {
    var s = state.semana, fim = addDays(s, 5);
    $('weekLabel').textContent = s.getDate() + ' ' + MESES[s.getMonth()] + ' – ' + fim.getDate() + ' ' + MESES[fim.getMonth()] + ' ' + fim.getFullYear();
    var html = '';
    for (var i = 0; i < 6; i++) {
      var d = addDays(s, i), k = iso(d);
      var n = state.itens.filter(function (x) { return x.data === k && !x.livre; }).length;
      html += '<button class="day' + (i === state.dia ? ' sel' : '') + (k === iso(hoje) ? ' today' : '') + '" data-i="' + i + '">' +
        '<small>' + DIAS[i] + '</small><b>' + d.getDate() + '</b><i>' + (n ? n + ' ag.' : '') + '</i></button>';
    }
    $('days').innerHTML = html;

    var diaIso = iso(addDays(s, state.dia));
    var lista = state.itens.filter(function (x) { return x.data === diaIso && !x.livre; });
    $('dayTitle').textContent = DIAS_LONGOS[state.dia] + ', ' + br(diaIso).slice(0, 5);
    // Cada horário fixo tem uma vaga por equipe (na ordem em que estão na planilha)
    var linhas = [], usados = {}, livres = 0;
    HORARIOS.forEach(function (h) {
      var m = hhmmToMin(h), todas = linhasDoHorario(diaIso, m);
      var n = Math.max(EQUIPES.length, todas.length);
      for (var i = 0; i < n; i++) {
        var x = todas[i], eq = EQUIPES[i] || 'Extra';
        if (x) usados[x.row] = 1;
        if (x && !x.livre) linhas.push({ min: m, ord: i, x: x, equipe: eq });
        else { livres++; linhas.push({ min: m, ord: i, livre: h, vaga: x || null, equipe: eq }); }
      }
    });
    // Agendamentos fora dos horários fixos
    lista.forEach(function (x) { if (!usados[x.row]) linhas.push({ min: x.min == null ? 9999 : x.min, ord: 0, x: x }); });
    linhas.sort(function (a, b) { return a.min - b.min || a.ord - b.ord; });
    $('dayTotal').textContent = lista.length + ' agendado(s) · ' + livres + ' vaga(s)';
    var out = '', almocoFeito = false;
    linhas.forEach(function (l) {
      var x = l.x;
      if (!almocoFeito && l.min >= 12 * 60 + 10 && l.min < 9999) {
        out += '<div class="lunch">Almoço · 12h10 – 13h40</div>';
        almocoFeito = true;
      }
      if (l.livre) {
        out += '<div class="card free" data-livre="' + l.livre + '"' + (l.vaga ? ' data-vrow="' + l.vaga.row + '"' : '') + '>' +
          '<div class="time">' + fmtHora(l.min) + '</div>' +
          '<div class="info"><div class="name">Livre</div><div class="meta"><span class="eq">' + l.equipe + '</span><span>Toque para agendar</span></div></div>' +
          '<div class="plus">+</div></div>';
        return;
      }
      out += '<div class="card" data-row="' + x.row + '">' +
        '<div class="time">' + esc(fmtHora(x.min, x.hora)) + '</div>' +
        '<div class="info"><div class="name">' + esc(x.nome || 'Sem nome') + (x.obs ? '<span class="tag">' + esc(x.obs) + '</span>' : '') + '</div>' +
        '<div class="meta">' + (l.equipe ? '<span class="eq">' + l.equipe + '</span>' : '') + '<span>' + esc(x.telefone || 'sem telefone') + '</span><span>' + esc(x.servico || '') + '</span></div></div></div>';
    });
    $('list').innerHTML = out;
  }

  // ---------- Navegação ----------
  $('days').addEventListener('click', function (e) {
    var b = e.target.closest('.day'); if (!b) return;
    state.dia = +b.dataset.i; render();
  });
  $('prevWeek').onclick = function () { state.semana = addDays(state.semana, -7); carregar(); };
  $('nextWeek').onclick = function () { state.semana = addDays(state.semana, 7); carregar(); };
  $('btnHoje').onclick = function () { state.semana = monday(hoje); state.dia = hoje.getDay() === 0 ? 0 : hoje.getDay() - 1; carregar(); };
  $('btnRefresh').onclick = function () { carregar().then(function () { toast('Atualizado'); }); };

  // ---------- Sheets ----------
  var aberta = null;
  function abrir(id) { fechar(true); aberta = $(id); $('sheetBg').style.display = 'block'; requestAnimationFrame(function () { aberta.classList.add('open'); }); }
  function fechar(rapido) {
    if (!aberta) return;
    aberta.classList.remove('open'); aberta = null;
    if (!rapido) setTimeout(function () { if (!aberta) $('sheetBg').style.display = 'none'; }, 200);
  }
  $('sheetBg').onclick = function () { fechar(); };
  $('btnCancel').onclick = function () { fechar(); };

  // ---------- Formulário ----------
  var OBS = ['retorno', 'diagnóstico', 'manutenção', 'aguardando'];
  $('obsChips').innerHTML = OBS.map(function (o) { return '<button type="button" class="chip" data-v="' + o + '">' + o + '</button>'; }).join('');
  $('obsChips').onclick = function (e) { var c = e.target.closest('.chip'); if (!c) return; $('fObs').value = $('fObs').value === c.dataset.v ? '' : c.dataset.v; marcaChips(); };
  $('horaChips').onclick = function (e) { var c = e.target.closest('.chip'); if (!c) return; $('fHora').value = c.dataset.v; marcaChips(); checar(); };
  ['fObs', 'fHora'].forEach(function (id) { $(id).addEventListener('input', function () { marcaChips(); checar(); }); });
  $('fData').addEventListener('input', function () { montaHoras(); checar(); });

  function montaHoras() {
    var d = $('fData').value;
    $('horaChips').innerHTML = HORARIOS.map(function (h) {
      var n = d ? ocupados(d, hhmmToMin(h)).length : 0;
      return '<button type="button" class="chip ' + (n >= EQUIPES.length ? 'ocupado' : 'livre') + '" data-v="' + h + '">' +
        fmtHora(hhmmToMin(h)) + '<small>' + vagasTexto(n) + '</small></button>';
    }).join('');
    marcaChips();
  }

  function marcaChips() {
    Array.prototype.forEach.call($('obsChips').children, function (c) { c.classList.toggle('on', c.dataset.v === $('fObs').value); });
    Array.prototype.forEach.call($('horaChips').children, function (c) { c.classList.toggle('on', c.dataset.v === $('fHora').value); });
  }
  function checar() {
    var h = $('hint'), d = $('fData').value, t = $('fHora').value, msgs = [];
    if (d && fromIso(d).getDay() === 0) msgs.push('Domingo não tem coluna na planilha. Escolha de segunda a sábado.');
    if (t) {
      var m = hhmmToMin(t);
      if (m >= 12 * 60 + 10 && m < 13 * 60 + 40) msgs.push('Esse horário cai no intervalo de almoço (12h10 – 13h40).');
      var mesmo = d ? ocupados(d, m) : [];
      if (HORARIOS.some(function (h) { return Math.abs(hhmmToMin(h) - m) <= 5; })) {
        if (mesmo.length >= EQUIPES.length) msgs.push('Esse horário já está lotado (as ' + EQUIPES.length + ' equipes estão ocupadas).');
        else if (mesmo.length) msgs.push('Vai para a ' + EQUIPES[mesmo.length] + ' (a ' + EQUIPES[0] + ' já está com ' + (mesmo[0].nome || 'alguém') + ').');
      } else if (mesmo.length) msgs.push('Já existe ' + mesmo.length + ' agendamento(s) nesse horário.');
    }
    h.innerHTML = msgs.map(esc).join('<br>'); h.style.display = msgs.length ? 'block' : 'none';
  }

  function novo(hora, vaga) {
    state.editando = null;
    state.vaga = vaga || null;
    $('formTitle').textContent = 'Novo agendamento';
    $('fNome').value = ''; $('fObs').value = ''; $('fTel').value = '';
    $('fData').value = iso(addDays(state.semana, state.dia)); $('fHora').value = hora || '';
    $('fServ').value = 'HIGIENIZAÇÃO';
    montaHoras(); checar(); abrir('formSheet');
  }
  function editar(x) {
    state.editando = x; state.vaga = null;
    $('formTitle').textContent = 'Editar agendamento';
    $('fNome').value = x.nome || ''; $('fObs').value = x.obs || ''; $('fTel').value = x.telefone || '';
    $('fData').value = x.data; $('fHora').value = x.min != null ? minToHHMM(x.min) : '';
    $('fServ').value = x.servico || '';
    montaHoras(); checar(); abrir('formSheet');
  }
  $('fab').onclick = function () { novo(); };

  $('form').onsubmit = function (e) {
    e.preventDefault();
    var dados = {
      nome: $('fNome').value.trim(), obs: $('fObs').value.trim(), telefone: $('fTel').value.trim(),
      data: $('fData').value, hora: $('fHora').value, servico: $('fServ').value.trim() || 'HIGIENIZAÇÃO'
    };
    if (!dados.nome) return toast('Coloque o nome do cliente', true);
    if (!dados.data || !dados.hora) return toast('Escolha a data e o horário', true);
    if (fromIso(dados.data).getDay() === 0) return toast('Domingo não é permitido na planilha', true);
    var btn = $('btnSave'); btn.disabled = true; btn.textContent = 'Salvando…';
    var vg = state.vaga;
    if (vg && vg.data === dados.data && Math.abs(vg.min - hhmmToMin(dados.hora)) <= 5) { dados.vagaRow = vg.row; dados.vagaChave = vg.chave; }
    var p = state.editando
      ? call('editarAgendamento', state.editando.row, state.editando.chave, dados)
      : call('criarAgendamento', dados);
    p.then(function () {
      fechar();
      toast(state.editando ? 'Agendamento atualizado na planilha' : 'Agendado! Já está na planilha ✓');
      var d = fromIso(dados.data);
      state.semana = monday(d); state.dia = d.getDay() - 1;
      return carregar();
    }).catch(function (err) {
      toast((err && err.message) || 'Erro ao salvar', true);
    }).then(function () { btn.disabled = false; btn.textContent = 'Salvar na planilha'; });
  };

  // ---------- Detalhes ----------
  $('list').addEventListener('click', function (e) {
    var c = e.target.closest('.card'); if (!c) return;
    if (c.dataset.livre) {
      var vg = c.dataset.vrow ? state.itens.filter(function (i) { return String(i.row) === c.dataset.vrow; })[0] : null;
      return novo(c.dataset.livre, vg);
    }
    var x = state.itens.filter(function (i) { return String(i.row) === c.dataset.row; })[0]; if (!x) return;
    state.atual = x;
    $('dTitle').textContent = (x.nome || 'Sem nome') + (x.obs ? ' – ' + x.obs : '');
    var linhas = [['Data', br(x.data)], ['Horário', fmtHora(x.min, x.hora)], ['Telefone', x.telefone || '—'],
      ['Serviço', x.servico || '—'], ['Linha na planilha', x.row]];
    $('dBody').innerHTML = linhas.map(function (l) { return '<div class="detail-line"><span>' + l[0] + '</span><b>' + esc(l[1]) + '</b></div>'; }).join('');
    var tel = digits(x.telefone);
    if (tel.length >= 10) {
      var wa = tel.length <= 11 ? '55' + tel : tel;
      $('dContact').innerHTML = '<a href="https://wa.me/' + wa + '" target="_blank" rel="noopener">WhatsApp</a><a href="tel:' + tel + '">Ligar</a>';
    } else $('dContact').innerHTML = '';
    abrir('detailSheet');
  });
  $('btnEdit').onclick = function () { editar(state.atual); };
  $('btnDelete').onclick = function () {
    var x = state.atual;
    if (!confirm('Excluir o agendamento de ' + (x.nome || 'sem nome') + ' às ' + fmtHora(x.min, x.hora) + '? A vaga volta a ficar livre na planilha.')) return;
    var b = $('btnDelete'); b.disabled = true;
    call('excluirAgendamento', x.row, x.chave).then(function () {
      fechar(); toast('Agendamento cancelado — vaga livre'); return carregar();
    }).catch(function (err) { toast((err && err.message) || 'Erro ao cancelar', true); })
      .then(function () { b.disabled = false; });
  };

  // ---------- Toast ----------
  var tt;
  function toast(msg, err) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(tt); tt = setTimeout(function () { t.className = 'toast' + (err ? ' err' : ''); }, 2600);
  }

  // ---------- Demonstração (quando aberto fora do Google) ----------
  var Demo = (function () {
    var rows = [], seq = 4;
    var base = monday(hoje);
    [[0, '08:30', 'Maria', '', '94 8118-9184'], [0, '08:30', 'Rafael', '', '94 9100-7083'], [0, '10:30', 'João', 'retorno', '87 99122-3212'],
     [0, '14:00', 'Ana', '', '94 9270-4243'], [0, '16:00', 'Pedro', 'diagnóstico', '94 9903-5699'],
     [1, '08:30', 'Carla', '', '94 9170-9042'], [2, '10:30', 'Lucas', 'manutenção', ''],
     [3, '14:00', 'Bruna', '', '94 8442-9352']].forEach(function (r) {
      var m = hhmmToMin(r[1]);
      rows.push({ row: seq++, data: iso(addDays(base, r[0])), hora: fmtHora(m), min: m, nome: r[2], obs: r[3],
        telefone: r[4], servico: 'HIGIENIZAÇÃO' });
    });
    [[1, '10:30'], [1, '10:30']].forEach(function (r) {
      var m = hhmmToMin(r[1]);
      rows.push({ row: seq++, data: iso(addDays(base, r[0])), hora: fmtHora(m), min: m, nome: 'Cliente', obs: '', telefone: '', servico: 'HIGIENIZAÇÃO', livre: true });
    });
    rows.forEach(function (r) { r.chave = 'k' + r.row; });
    function ok(v) { return new Promise(function (r) { setTimeout(function () { r(v); }, 250); }); }
    function mk(d, row) {
      var m = hhmmToMin(d.hora);
      return { row: row, chave: 'k' + row, data: d.data, hora: fmtHora(m), min: m, nome: d.nome, obs: d.obs,
        telefone: d.telefone, servico: d.servico.toUpperCase() };
    }
    return {
      listarAgendamentos: function (de, ate) {
        return ok(rows.filter(function (r) { return r.data >= de && r.data <= ate; })
          .sort(function (a, b) { return a.data < b.data ? -1 : a.data > b.data ? 1 : a.min - b.min; }).map(function (r) { return Object.assign({}, r); }));
      },
      listarServicos: function () { return ok(['HIGIENIZAÇÃO']); },
      criarAgendamento: function (d) {
        var v = rows.filter(function (r) { return r.livre && r.data === d.data && Math.abs(r.min - hhmmToMin(d.hora)) <= 5; })
          .sort(function (a, b) { return (b.row === d.vagaRow) - (a.row === d.vagaRow) || a.row - b.row; })[0];
        if (v) { rows = rows.filter(function (r) { return r !== v; }); rows.push(mk(Object.assign({}, d, { hora: minToHHMM(v.min) }), v.row)); }
        else rows.push(mk(d, seq++));
        return ok({ ok: true });
      },
      editarAgendamento: function (row, k, d) { rows = rows.filter(function (r) { return r.row !== row; }); rows.push(mk(d, row)); return ok({ ok: true }); },
      excluirAgendamento: function (row) {
        rows.forEach(function (r) { if (r.row === row) { r.livre = true; r.nome = 'Cliente'; r.obs = ''; r.telefone = ''; } });
        return ok({ ok: true });
      }
    };
  })();

  // ---------- Início ----------
  if (DEMO) $('demo').hidden = false;
  call('listarServicos').then(function (s) {
    $('servicos').innerHTML = (s || []).map(function (x) { return '<option value="' + esc(x) + '">'; }).join('');
  }).catch(function () {});
  carregar();
})();
</script>
</body>
</html>
