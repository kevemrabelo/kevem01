<style>
  /* Layout: cabeçalho fixo com a semana; lista do dia em vagas por equipe; formulário em folha inferior */

    --free: #5bd88a; --free-soft: #12291c; --free-line: #2c6a43;

  main { padding-block: 14px 110px; }

  .dtitle h2 { font: 700 17px/1.3 var(--font-display); margin: 0; }
  .dtitle h2::first-letter { text-transform: uppercase; }

  .hour { font: 700 17px/1 var(--font-display); color: var(--brand); padding-top: 14px; font-variant-numeric: tabular-nums; }
  .teams { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; cursor: pointer; width: 100%; text-align: left; }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; flex-wrap: wrap; }
  .eq { font-weight: 700; color: var(--brand); font-size: 12px; letter-spacing: .02em; }
  .eq.t0, .card.free .eq.t0 { background: var(--t0-soft); color: var(--t0-fg); border: 1px solid var(--t0); border-radius: 999px; padding: 0 8px; }
  .eq.t1, .card.free .eq.t1 { background: var(--t1-soft); color: var(--t1-fg); border: 1px solid var(--t1); border-radius: 999px; padding: 0 8px; }
  .card.t0 { border-left: 6px solid var(--t0); }
  .card.t1 { border-left: 6px solid var(--t1); }
  .card.free.t0 { border-left: 6px solid var(--t0); }
  .card.free.t1 { border-left: 6px solid var(--t1); }
  .sp.t0:not(.on) { border-left: 6px solid var(--t0); }
  .sp.t1:not(.on) { border-left: 6px solid var(--t1); }
  .tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); margin-left: 6px; vertical-align: 1px; }
  .card.free { background: var(--free-soft); border: 1.5px dashed var(--free-line); }
  .card.free .name, .card.free .eq { color: var(--free); }
  .plus { color: var(--free); font: 700 22px/1 var(--font-display); }

  .skeleton { height: 46px; border-radius: 12px; background: var(--line); opacity: .5; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 18px 18px 0 0; max-height: 92%; overflow-y: auto; max-width: 640px; margin: 0 auto; padding-block: 8px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .grab { width: 40px; height: 5px; background: var(--line); border-radius: 3px; margin: 2px auto 10px; }
  .sheet h3 { font: 700 18px/1.3 var(--font-display); margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 4px; font-weight: 600; letter-spacing: .02em; }
  input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 16px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
  .slotpick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
  .sp { border: 1px solid var(--free-line); background: var(--free-soft); color: var(--free); border-radius: 12px; padding: 8px 10px; cursor: pointer; text-align: left; }
  .sp b { font-family: var(--font-display); }
  .sp small { display: block; font-size: 11.5px; }

  .sp.on { border-color: var(--brand); background: var(--brand); color: var(--brand-fg); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; cursor: pointer; font-size: 15px; }
  .btn.primary { background: var(--brand); color: var(--brand-fg); }
  .btn.ghost { background: var(--bg); border: 1px solid var(--line); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn:disabled { opacity: .6; cursor: default; }
  .dl { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .dl span { color: var(--muted); }
  .dl b { text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .confirm { background: var(--danger-soft); color: var(--danger); border-radius: 12px; padding: 12px; margin-top: 14px; font-size: 14px; }
  .os { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 6px; }
  .os h4 { font: 700 15px/1.3 var(--font-display); margin: 8px 0 0; }
  textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font: inherit; font-size: 16px; color: inherit; min-height: 70px; resize: vertical; }
  .tec { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tec button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px; font-weight: 600; cursor: pointer; }
  .tec button.on { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }
  .prev { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font: inherit; font-size: 14px; }
  .copy { width: 100%; margin-top: 10px; border: 0; border-radius: 12px; padding: 13px; font-weight: 700; background: var(--brand-soft); color: var(--brand); cursor: pointer; font-size: 15px; }
  .wa { display: inline-block; margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); font-weight: 600; text-decoration: none; }

  .fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--brand); color: var(--brand-fg); border: 0; border-radius: 16px; padding: 14px 20px; font-weight: 700; font-size: 15px; box-shadow: 0 6px 18px rgba(15,138,68,.35); display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 30; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
  .toast.err { background: var(--danger); color: #fff; }
  @media (prefers-reduced-motion: no-preference) { .sheet { animation: up .2s ease; } @keyframes up { from { transform: translateY(30px); opacity: .6; } } }

  /* ===== Acabamento visual ===== */
  :root { --shadow: 0 1px 2px rgba(10,14,12,.06), 0 4px 14px rgba(10,14,12,.07); --shadow-lg: 0 10px 30px rgba(0,0,0,.28); --head2: rgba(18,170,85,.38); --ring: rgba(15,138,68,.2); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 10px 30px rgba(0,0,0,.45); --head2: rgba(47,207,114,.22); --ring: rgba(47,207,114,.25); } }
  :root[data-theme="dark"] { --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 10px 30px rgba(0,0,0,.45); --head2: rgba(47,207,114,.22); --ring: rgba(47,207,114,.25); }
  body { -webkit-font-smoothing: antialiased; }
  header.top { background: radial-gradient(120% 90% at 100% 0%, var(--head2) 0%, transparent 60%), var(--head); padding-block: 14px 16px; border-radius: 0 0 22px 22px; box-shadow: var(--shadow-lg), inset 0 -3px 0 var(--brand); }
  .day.sel { background: #ffffff; color: #0c0e0d; }
  .day.sel small, .day.sel i { color: #0f8a44; opacity: 1; }
  .live .dot { background: #2fcf72; }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .logo { width: 42px; height: 42px; border-radius: 13px; background: var(--brand); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 4px 14px rgba(15,138,68,.45); }
  .logo svg { width: 24px; height: 24px; }
  h1 { font-size: 19px; }
  .live { margin-top: 3px; background: rgba(0,0,0,.14); padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 11.5px; opacity: 1; }
  .ibtn { border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); transition: background .15s; }
  .ibtn:hover { background: rgba(255,255,255,.24); }
  .week { margin-top: 14px; }
  .week .ibtn { width: 34px; height: 34px; background: transparent; box-shadow: none; }
  .week span { background: rgba(0,0,0,.14); padding: 6px 14px; border-radius: 999px; font-size: 13.5px; letter-spacing: .01em; }
  .days { gap: 7px; margin-top: 12px; }
  .day { padding: 8px 0 6px; border-radius: 14px; transition: transform .15s, background .15s; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }

  .day b { font-size: 19px; }
  .day i { font-weight: 600; }
  .day.sel { box-shadow: 0 6px 16px rgba(0,0,0,.18); }


  main { padding-block: 20px 120px; }
  .dtitle { align-items: center; margin: 0 0 16px; }
  .dtitle h2 { font-size: 20px; letter-spacing: -.01em; }
  .dtitle span { background: var(--card); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; box-shadow: var(--shadow); }
  .slot { position: relative; grid-template-columns: 62px minmax(0, 1fr); gap: 12px; margin-bottom: 14px; }
  .hour { padding-top: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .hour::before { content: attr(data-h); }

  .hour::after { content: ""; flex: 1; width: 2px; background: linear-gradient(var(--line), transparent); border-radius: 2px; }

  .card { border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); border-color: transparent; transition: transform .12s, box-shadow .15s; }

  .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 700 15px/1 var(--font-display); flex: none; background: var(--brand-soft); color: var(--brand); }

<script>

  function tc(i) { return i === 0 ? ' t0' : i === 1 ? ' t1' : ''; }

  // ===== Conexão =====

      .then(function (r) { onData(r); return S.linhas; }, function (e) { onErr(e); throw e; });

  // ===== Escrita =====
  function upd(range, values) { return S.mcp.callTool(SERVER, 'update_values', { spreadsheetId: SHEET_ID, range: TAB + '!' + range, values: values }, { cache: false }); }

  function fill(row, d) { return upd('A' + row + ':B' + row, [[joinName(d.nome, d.obs), d.tel || '']]).then(function () { return upd('P' + row + ':W' + row, [[(d.serv || SERV).toUpperCase()].concat(osVals(d))]); }); }
  function free(row) { return upd('A' + row + ':B' + row, [[NOME_VAGA, '']]).then(function () { return upd('P' + row + ':W' + row, [[SERV].concat(osVals({}))]); }); }
  function blankRow() { var v = []; for (var i = 0; i < NV; i++) v.push(''); return v; }
  function apptRow(w, iso, min, nome, tel, serv) {

  }
  function lunchRow(w) { var v = blankRow(); v[0] = 'INTERVALO DE ALMOÇO'; if (w > 0) v[colData(w) - 3] = 'ALMOÇO'; v[colData(w) - 1] = ALMOCO_TXT; return v; }
  function headerRow() { return ['', '', 'Valor do serviço', 'Segunda-feira', 'Horas', 'Terça-feira', 'Horas', 'Quarta-feira', 'Horas', 'Quinta-feira', 'Horas', 'Sexta-feira', 'Horas', 'sabado', 'Horas', '', '', '', '', '', '', '', '']; }

  // Onde inserir quando não há vaga livre (mesma regra do script da planilha)
  function plano(L, d) {
    var iso = d.data, w = wd(iso), min = d.min, ap = L.filter(function (l) { return l.tipo === 'appt'; });
    var doDia = ap.filter(function (l) { return l.data === iso; });
    var alvo = { tipo: 'appt', v: apptRow(w, iso, min, joinName(d.nome, d.obs), d.tel, d.serv).slice(0, NCOL).concat(osVals(d)), alvo: true };
    if (doDia.length) {
      var first = doDia[0].row, last = doDia[doDia.length - 1].row, lunch = null;
      for (var r = first; r <= last + 1 && r <= L.length; r++) if (L[r - 1].tipo === 'lunch') { lunch = r; break; }

    hs.forEach(function (m) {

    });
    function fimBloco(row) { var r = row, dd = L[row - 1].data; while (r < L.length && (L[r].tipo === 'appt' || L[r].tipo === 'lunch')) { if (L[r].tipo === 'appt' && L[r].data !== dd) break; r++; } return r; }
    function iniBloco(row) { var r = row, dd = L[row - 1].data; while (r > 1 && (L[r - 2].tipo === 'appt' || L[r - 2].tipo === 'lunch')) { if (L[r - 2].tipo === 'appt' && L[r - 2].data !== dd) break; r--; } return r; }
    var B = { tipo: 'blank', v: blankRow() }, Hd = { tipo: 'header', v: headerRow() };

  function inserir(L, p) {

  function salvar(d) {

      if (d.editRow) {
        var cur = L[d.editRow - 1];
        if (!cur || cur.tipo !== 'appt' || cur.raw[0] !== d.editRaw[0] || cur.raw[1] !== d.editRaw[1]) throw { code: 'changed' };
        if (cur.data === d.data && near(cur.min, d.min)) return fill(cur.row, d);
        return free(cur.row).then(function () { return lerAgora(); }).then(function (L2) { return agendar(L2, d); });
      }
      return agendar(L, d);
    });
  }
  function agendar(L, d) {
    var v = null;
    if (d.vagaRow) { var c = L[d.vagaRow - 1]; if (c && c.tipo === 'appt' && c.livre && c.data === d.data && near(c.min, d.min)) v = c; }
    if (!v && d.vagaRow) throw { code: 'taken' };
    if (!v) v = L.filter(function (l) { return l.tipo === 'appt' && l.livre && l.data === d.data && near(l.min, d.min); }).sort(function (a, b) { return a.row - b.row; })[0];
    if (v) return fill(v.row, d);
    return inserir(L, plano(L, d));
  }
  function cancelar(l) {
    return lerAgora().then(function (L) {
      var cur = L[l.row - 1];
      if (!cur || cur.tipo !== 'appt' || cur.raw[0] !== l.raw[0] || cur.raw[1] !== l.raw[1]) throw { code: 'changed' };
      var noHor = L.filter(function (x) { return x.tipo === 'appt' && x.data === cur.data && near(x.min, cur.min); }).length;
      if (slotOf(cur.min) != null && noHor <= EQUIPES.length) return free(cur.row);
      return batch([{ deleteDimension: { range: { sheetId: TAB_ID, dimension: 'ROWS', startIndex: cur.row - 1, endIndex: cur.row } } }]);
    });
  }
  function writeErr(e) {
    if (e && e.code === 'changed') return 'Essa linha mudou na planilha enquanto você editava. A lista foi atualizada; confira e tente de novo.';
    if (e && e.code === 'taken') return 'Essa vaga acabou de ser ocupada por outra pessoa. Escolha outra.';
    if (e && (e.code === 'server_unavailable' || e.code === 'upstream_error')) return 'O Google não confirmou a gravação. Confira a lista antes de tentar de novo.';
    return errMsg(e)[0];
  }

  // ===== Ordem de Serviço =====
  function lsGet(k, def) { try { var v = localStorage.getItem(k); return v == null ? def : v; } catch (e) { return def; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function osTexto(o) {
    var icon = /kevem/i.test(o.tec || '') ? '☀️' : '🌍';
    return Array(10).join(icon) + '\n\n' +
      '📩 ORDEM DE SERVIÇO\n\n' +
      '👤 Nome: ' + (o.nome || '') + '\n' +
      '📞 Telefone: ' + (o.tel || '') + '\n' +
      '🏠 Endereço: ' + (o.end || '') + '\n\n' +
      '📍 Localização: ' + (o.loc || '') + '\n\n' +
      '🧺 Máquina (marca): ' + (o.maq || '') + '\n' +
      '⚠️ serviço: ' + (o.serv || '') + '\n' +
      '💸 Valor: ' + (o.valor || '') + '\n\n' +
      '⏰ Hora: ' + (o.hora || '') + '\n\n' +
      '💳 Forma Pagamento: ' + (o.pag || '') + '\n\n' +
      'Pix pagamento: ' + (o.pix || '') + '\n\n' +
      (o.tit || '') + '\n\n' +
      'Tecnico: ' + (o.tec || '') + '\n\n' +
      '📝 Obs: ' + (o.oobs || '');
  }
  function servTitulo(sv) { sv = (sv || '').trim(); return sv ? sv.charAt(0) + sv.slice(1).toLowerCase() : ''; }
  function formOs() {
    var sel = S.form && S.form.sel;
    return {
      nome: $('fNome').value.trim(), tel: $('fTel').value.trim(), end: $('oEnd').value.trim(), loc: $('oLoc').value.trim(),
      maq: $('oMaq').value.trim(), serv: servTitulo($('fServ').value), valor: $('oValor').value.trim(),
      hora: sel ? hm(sel.h).toUpperCase() : '', pag: $('oPag').value.trim(), pix: $('oPix').value.trim(),
      tit: $('oTit').value.trim(), tec: S.form ? S.form.tec : OS_PADRAO.tec, oobs: $('oObs').value.trim()
    };
  }
  function prevForm() { if (S.form) $('oPrev').textContent = osTexto(formOs()); }
  function marcaTec() { Array.prototype.forEach.call($('tecPick').children, function (b) { b.classList.toggle('on', S.form && b.dataset.t === S.form.tec); }); }
  $('tecPick').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; S.form.tec = b.dataset.t; marcaTec(); prevForm(); };
  ['fNome', 'fTel', 'fServ', 'oEnd', 'oLoc', 'oMaq', 'oValor', 'oPag', 'oPix', 'oTit', 'oObs'].forEach(function (id) { $(id).addEventListener('input', prevForm); });
  $('oPix').addEventListener('input', function () { lsSet('osPix', $('oPix').value); });
  $('oTit').addEventListener('input', function () { lsSet('osTit', $('oTit').value); });
  function preencheOs(os) {
    os = os || {};
    $('oEnd').value = os.end || ''; $('oLoc').value = os.loc || ''; $('oMaq').value = os.maq || '';
    $('oValor').value = os.valor || OS_PADRAO.valor; $('oPag').value = os.pag || OS_PADRAO.pag; $('oObs').value = os.oobs || '';
    $('oPix').value = lsGet('osPix', OS_PADRAO.pix); $('oTit').value = lsGet('osTit', OS_PADRAO.tit);
    S.form.tec = os.tec || OS_PADRAO.tec; marcaTec(); prevForm();
  }
  function copiar(texto, btn) {
    var orig = btn.textContent;
    function ok() { btn.textContent = '✅ Copiado!'; setTimeout(function () { btn.textContent = orig; }, 1600); }
    function fb() {
      var t = document.createElement('textarea'); t.value = texto; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { if (document.execCommand('copy')) ok(); else throw 0; } catch (e) { toast('Não deu para copiar sozinho. Segure o dedo na prévia e copie.', true); }
      document.body.removeChild(t);
    }
    try { navigator.clipboard.writeText(texto).then(ok, fb); } catch (e) { fb(); }
  }
  $('oCopy').onclick = function () { copiar(osTexto(formOs()), $('oCopy')); };
  $('dCopy').onclick = function () { copiar($('dOs').textContent, $('dCopy')); };

  // ===== Folhas (formulário e detalhes) =====
  var open = null;
  function abrir(id) { fechar(); open = $(id); open.hidden = false; $('bg').hidden = false; }
  function fechar() { if (open) open.hidden = true; open = null; $('bg').hidden = true; }
  $('bg').onclick = fechar; $('fCancel').onclick = fechar;

  $('obsChips').innerHTML = OBS.map(function (o) { return '<button type="button" class="chip" data-v="' + o + '">' + o + '</button>'; }).join('');
  $('obsChips').onclick = function (e) { var c = e.target.closest('.chip'); if (!c) return; $('fObs').value = $('fObs').value === c.dataset.v ? '' : c.dataset.v; marcaObs(); };
  $('fObs').oninput = marcaObs;
  function marcaObs() { Array.prototype.forEach.call($('obsChips').children, function (c) { c.classList.toggle('on', c.dataset.v === $('fObs').value); }); }
  $('fData').oninput = function () { S.form.sel = null; pickSlots(); };

  function pickSlots() {
    var iso = $('fData').value, h = '';
    if (!iso || wd(iso) < 0) { $('slotPick').innerHTML = '<p class="sub">' + (iso ? 'Domingo não tem coluna na planilha. Escolha de segunda a sábado.' : 'Escolha a data.') + '</p>'; return; }
    var vd = vagasDoDia(iso), sel = S.form.sel;
    vd.fixos.forEach(function (f) {
      f.list.slice(0, EQUIPES.length).forEach(function (v) {
        var mine = S.form.edit && v.l && v.l.row === S.form.edit.row;
        var livre = !v.l || v.l.livre || mine;
        var on = sel && sel.h === v.h && sel.i === v.i;
        h += '<button type="button" class="sp' + tc(v.i) + (livre ? '' : ' full') + (on ? ' on' : '') + '" data-h="' + v.h + '" data-i="' + v.i + '"' + (v.l ? ' data-row="' + v.l.row + '"' : '') + (livre ? '' : ' disabled') + '><b>' + hm(v.h) + '</b> · ' + v.eq + '<small>' + (mine ? 'atual' : livre ? 'livre' : esc(v.l.nome || 'ocupado')) + '</small></button>';
      });
    });
    $('slotPick').innerHTML = h;
  }
  $('slotPick').onclick = function (e) {
    var b = e.target.closest('.sp'); if (!b || b.disabled) return;
    S.form.sel = { h: +b.dataset.h, i: +b.dataset.i, row: b.dataset.row ? +b.dataset.row : null }; pickSlots(); prevForm();
  };

  function novo(h, row) {
    var iso = isoD(addDays(S.semana, S.dia));
    S.form = { edit: null, sel: null };
    if (h != null) { var i = 0; vagasDoDia(iso).fixos.forEach(function (f) { f.list.forEach(function (v) { if (v.h === h && ((row && v.l && v.l.row === row) || (!row && !v.l))) i = v.i; }); }); S.form.sel = { h: h, i: i, row: row || null }; }
    $('fTitle').textContent = 'Novo agendamento'; $('fSub').textContent = 'Grava direto na planilha.';
    $('fNome').value = ''; $('fObs').value = ''; $('fTel').value = ''; $('fServ').value = SERV; $('fData').value = iso;
    marcaObs(); pickSlots(); preencheOs(null); abrir('formSheet'); $('fSave').disabled = false; $('fSave').textContent = 'Salvar na planilha';
  }
  function editar(l) {
    S.form = { edit: l, sel: null };
    var s = slotOf(l.min);
    if (s != null) { vagasDoDia(l.data).fixos.forEach(function (f) { f.list.forEach(function (v) { if (v.l && v.l.row === l.row) S.form.sel = { h: v.h, i: v.i, row: l.row }; }); }); }
    $('fTitle').textContent = 'Editar agendamento'; $('fSub').textContent = 'Linha ' + l.row + ' da planilha.';
    $('fNome').value = l.nome; $('fObs').value = l.obs; $('fTel').value = l.tel; $('fServ').value = l.serv || SERV; $('fData').value = l.data;
    marcaObs(); pickSlots(); preencheOs(l.os); abrir('formSheet'); $('fSave').disabled = false; $('fSave').textContent = 'Salvar na planilha';
  }
  $('fab').onclick = function () { if (!S.linhas) return toast('Espere a planilha carregar.', true); novo(null); };
  $('list').onclick = function (e) {
    var c = e.target.closest('.card'); if (!c || !S.linhas) return;
    if (c.classList.contains('free')) return novo(+c.dataset.h, c.dataset.row ? +c.dataset.row : null);
    var l = S.linhas[+c.dataset.row - 1]; if (!l) return; S.det = l;
    $('dName').textContent = (l.nome || 'Sem nome') + (l.obs ? ' – ' + l.obs : '');
    var rows = [['Data', br(l.data)], ['Horário', l.min == null ? l.hora : hm(l.min)], ['Telefone', l.tel || '—'], ['Serviço', l.serv || '—'], ['Linha na planilha', l.row]];
    $('dBody').innerHTML = rows.map(function (r) { return '<div class="dl"><span>' + r[0] + '</span><b>' + esc(r[1]) + '</b></div>'; }).join('');
    $('dOs').textContent = osTexto({ nome: l.nome, tel: l.tel, end: l.os.end, loc: l.os.loc, maq: l.os.maq, serv: servTitulo(l.serv),
      valor: l.os.valor, hora: (l.min == null ? l.hora : hm(slotOf(l.min) || l.min)).toUpperCase(), pag: l.os.pag,
      pix: lsGet('osPix', OS_PADRAO.pix), tit: lsGet('osTit', OS_PADRAO.tit), tec: l.os.tec, oobs: l.os.oobs });
    $('dCopy').textContent = '📋 Copiar ordem de serviço';
    var t = digits(l.tel); $('dWa').innerHTML = t.length >= 10 ? '<a class="wa" href="https://wa.me/' + (t.length <= 11 ? '55' + t : t) + '" target="_blank" rel="noopener">Abrir WhatsApp</a>' : '';
    $('dConfirm').innerHTML = ''; $('dCancelAppt').textContent = 'Cancelar agendamento'; $('dCancelAppt').disabled = false;
    abrir('detSheet');
  };
  $('dEdit').onclick = function () { editar(S.det); };
  $('dCancelAppt').onclick = function () {
    var b = $('dCancelAppt');
    if (!$('dConfirm').innerHTML) { $('dConfirm').innerHTML = '<div class="confirm">A vaga volta a ficar livre na planilha. Toque de novo para confirmar.</div>'; b.textContent = 'Confirmar cancelamento'; return; }
    b.disabled = true; b.textContent = 'Cancelando…';
    cancelar(S.det).then(function () { fechar(); toast('Cancelado. A vaga está livre.'); return lerAgora(); })
      .catch(function (e) { toast(writeErr(e), true); b.disabled = false; b.textContent = 'Cancelar agendamento'; $('dConfirm').innerHTML = ''; lerAgora().catch(function () {}); });
  };
  $('form').onsubmit = function (e) {
    e.preventDefault();
    var d = { nome: $('fNome').value.trim(), obs: $('fObs').value.trim(), tel: $('fTel').value.trim(), serv: $('fServ').value.trim() || SERV, data: $('fData').value };
    if (!d.nome) return toast('Coloque o nome do cliente.', true);
    if (!d.data || wd(d.data) < 0) return toast('Escolha uma data de segunda a sábado.', true);
    if (!S.form.sel) return toast('Escolha o horário e a equipe.', true);
    if (/^cliente$/i.test(d.nome) && !d.obs && !digits(d.tel)) return toast('Use o nome do cliente ou coloque o telefone.', true);
    var fo = formOs(); d.os = { end: fo.end, loc: fo.loc, maq: fo.maq, tec: fo.tec, valor: fo.valor, pag: fo.pag, oobs: fo.oobs };
    d.min = S.form.sel.h; d.vagaRow = S.form.sel.row && !(S.form.edit && S.form.sel.row === S.form.edit.row) ? S.form.sel.row : null;
    if (S.form.edit) { d.editRow = S.form.edit.row; d.editRaw = S.form.edit.raw; }
    var b = $('fSave'); b.disabled = true; b.textContent = 'Gravando…';
    salvar(d).then(function () {
      fechar(); toast(S.form.edit ? 'Atualizado na planilha.' : 'Agendado! Já está na planilha.');
      var dt = fromIso(d.data); S.semana = monday(dt); S.dia = dt.getDay() - 1; return lerAgora();
    }).catch(function (err) { toast(writeErr(err), true); b.disabled = false; b.textContent = 'Salvar na planilha'; lerAgora().then(pickSlots, function () {}); });
  };

  // ===== Navegação =====
  $('days').onclick = function (e) { var b = e.target.closest('.day'); if (!b) return; S.dia = +b.dataset.i; render(); };
  $('prev').onclick = function () { S.semana = addDays(S.semana, -7); render(); };
  $('next').onclick = function () { S.semana = addDays(S.semana, 7); render(); };
  $('btnHoje').onclick = function () { S.semana = monday(hoje); S.dia = hoje.getDay() === 0 ? 0 : hoje.getDay() - 1; render(); };
  $('btnSync').onclick = function () { lerAgora().then(function () { toast('Atualizado.'); }, function () {}); };

  var tt;
  function toast(m, err) { var t = $('toast'); t.textContent = m; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, err ? 5000 : 2600); }

  // ===== Início =====
  render();
  var use = window.claude && window.claude.use ? window.claude.use('mcp') : Promise.resolve(null);
  use.then(function (mcp) {
    if (!mcp) { setLive(false, 'Sem conexão'); banner('err', 'Abra este app pelo claude.ai (logado na sua conta) para ele conectar à sua planilha do Google.', null); S.linhas = null; render(); return; }
    S.mcp = mcp;
    // primeira leitura (é aqui que o claude.ai pede a permissão da planilha, se ainda não deu)
    lerAgora().catch(function () {});
    // mantém a lista sincronizada com a planilha (atualiza sozinha a cada ~30 s)
    mcp.watchTool(SERVER, 'get_values', READ, function (ev) {
      if (ev.type === 'data') onData(ev.result); else onErr(ev.error);
    }, { cache: { staleTime: 0, gcTime: 300000 }, refetchInterval: 30000 });
  }, function () { setLive(false, 'Sem conexão'); banner('err', 'Não consegui iniciar a conexão com a planilha.', null); });
})();
</script>
